# ===== Común a todos los perfiles =====
# Nombre del servicio (aparece en logs y métricas)
quarkus.application.name=exchange-service
# Puerto donde escucha el servicio
quarkus.http.port=8082
# Tipo de base de datos
quarkus.datasource.db-kind=postgresql

# ===== Perfil dev: tu Mac, conectado a los contenedores de Docker =====
# Entra por la "puerta" 5432 de tu Mac
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/exchangedb
# Credenciales locales, las mismas del docker-compose
%dev.quarkus.datasource.username=bancolab
%dev.quarkus.datasource.password=bancolab
# Entra por la "puerta" 6379 de tu Mac
%dev.quarkus.redis.hosts=redis://localhost:6379

# ===== Perfil prod: dentro de Kubernetes =====
# Se conecta por el nombre del servicio en la red interna
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres}:5432/${DB_NAME:exchangedb}
# Credenciales que llegan como variables de entorno, desde un Secret
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
# Redis por su nombre en la red interna
%prod.quarkus.redis.hosts=redis://${REDIS_HOST:redis}:6379